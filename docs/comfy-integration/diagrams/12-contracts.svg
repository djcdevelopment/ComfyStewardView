<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" role="img"
     aria-label="The contracts crossing each boundary: binary world save and JSON reference files inbound, a six-table DuckDB schema and snapshot provenance internally, and a versioned REST surface plus the Islet ingest contract outbound."
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>Contracts: what crosses each boundary, and in what shape</title>
  <style>
    .bg     { fill: #0d1320; }
    .box    { fill: #1a2336; stroke: #2a3450; stroke-width: 1; rx: 4; }
    .accent { fill: #2a1820; stroke: #c66; stroke-width: 1.5; rx: 4; }
    .band   { fill: #111a2a; stroke: #232c44; stroke-width: 1; rx: 6; }
    .hdr    { fill: #fff; font-size: 15px; font-weight: 600; }
    .band-t { fill: #fff; font-size: 13px; font-weight: 600; }
    .title  { fill: #fff; font-size: 12px; font-weight: 600; }
    .label  { fill: #cdd; font-size: 11px; }
    .sub    { fill: #8a94ab; font-size: 10.5px; }
    .code   { fill: #9c9; font-size: 10.5px; font-family: ui-monospace, monospace; }
    .key    { fill: #d9b; font-size: 10.5px; font-family: ui-monospace, monospace; }
    .arrow  { stroke: #667; stroke-width: 1.5; fill: none; marker-end: url(#arw-ct); }
    .edge   { fill: #aab; font-size: 10.5px; }
  </style>
  <defs>
    <marker id="arw-ct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#667"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="780"/>
  <text class="hdr" x="30" y="34">Contracts</text>
  <text class="sub" x="30" y="54">Every boundary the system has, and the shape of what crosses it. Versioned schemas are named; unversioned ones are noted as such.</text>

  <!-- INBOUND -->
  <rect class="band" x="30" y="76" width="336" height="422"/>
  <text class="band-t" x="46" y="98">Inbound — what Steward reads</text>

  <rect class="box" x="46" y="110" width="304" height="96"/>
  <text class="title" x="60" y="130">Valheim world save — binary</text>
  <text class="sub"   x="60" y="148">no version negotiation; layout is the contract</text>
  <text class="code"  x="60" y="167">header: version, netTime, myId, nextUid, count</text>
  <text class="code"  x="60" y="183">ZDO: flags, sector, pos, prefabHash, [props]</text>
  <text class="sub"   x="60" y="199">no ZDOID is stored — there is no stable object key</text>

  <rect class="accent" x="46" y="218" width="304" height="92"/>
  <text class="title" x="60" y="238">prefab-dump.json</text>
  <text class="code"  x="60" y="256">schema: comfy-prefab-dump/v1</text>
  <text class="code"  x="60" y="272">{name, hash, piece, wearNTear, category?}</text>
  <text class="label" x="60" y="290">3,458 entries · gameVersion 0.221.12</text>
  <text class="sub"   x="60" y="305">invariant enforced at load: sh(name) == hash</text>

  <rect class="box" x="46" y="322" width="304" height="76"/>
  <text class="title" x="60" y="342">classification.json</text>
  <text class="sub"   x="60" y="359">unversioned · 617 items</text>
  <text class="code"  x="60" y="377">{category, subcategory, tier, biome, source}</text>
  <text class="sub"   x="60" y="392">absent → classification silently disabled</text>

  <rect class="box" x="46" y="410" width="304" height="76"/>
  <text class="title" x="60" y="430">steward-config.json · regions.json</text>
  <text class="sub"   x="60" y="447">15 tunables; writes a default template if absent</text>
  <text class="sub"   x="60" y="464">regions optional — falls back to a synthetic</text>
  <text class="sub"   x="60" y="479">"Spawn Island" at the origin</text>

  <!-- INTERNAL -->
  <rect class="band" x="400" y="76" width="380" height="422"/>
  <text class="band-t" x="416" y="98">Internal — the durable store</text>

  <rect class="box" x="416" y="110" width="348" height="150"/>
  <text class="title" x="430" y="130">DuckDB schema — 6 tables</text>
  <text class="key"   x="430" y="150">world_snapshot</text>
  <text class="sub"   x="530" y="150">provenance + dictionary version</text>
  <text class="key"   x="430" y="168">zdo</text>
  <text class="sub"   x="530" y="168">one row per object, 9.16M</text>
  <text class="key"   x="430" y="186">container_item</text>
  <text class="sub"   x="530" y="186">inventory rows, ~406k</text>
  <text class="key"   x="430" y="204">render_cell</text>
  <text class="sub"   x="530" y="204">pre-aggregated map cells</text>
  <text class="key"   x="430" y="222">snapshot_delta</text>
  <text class="sub"   x="530" y="222">precomputed diff summary</text>
  <text class="key"   x="430" y="240">zdo_field</text>
  <text class="sub"   x="530" y="240">empty unless --cache-fields</text>

  <rect class="box" x="416" y="272" width="348" height="104"/>
  <text class="title" x="430" y="292">SnapshotProvenance (record)</text>
  <text class="code"  x="430" y="311">worldId · worldName · source · backupId</text>
  <text class="code"  x="430" y="327">saveTimestamp · fileHash · parserVersion</text>
  <text class="code"  x="430" y="343">schemaVersion = 3</text>
  <text class="sub"   x="430" y="362">one worldId per save lineage; copies differ by source</text>

  <rect class="accent" x="416" y="388" width="348" height="98"/>
  <text class="title" x="430" y="408">Object identity for deltas</text>
  <text class="code"  x="430" y="427">prefab_hash + position quantised to 1 cm</text>
  <text class="sub"   x="430" y="445">not zdo_index — that is the parse loop counter,</text>
  <text class="sub"   x="430" y="460">so comparing it compares array slots, not objects</text>
  <text class="sub"   x="430" y="477">self-check: added − removed == countTo − countFrom</text>

  <!-- OUTBOUND -->
  <rect class="band" x="814" y="76" width="336" height="422"/>
  <text class="band-t" x="830" y="98">Outbound — what Steward serves</text>

  <rect class="box" x="830" y="110" width="304" height="184"/>
  <text class="title" x="844" y="130">REST /api/v1 — 33 routes</text>
  <text class="sub"   x="844" y="147">envelope: apiVersion, schemaVersion, snapshotNetTime</text>
  <text class="code"  x="844" y="167">status summary points entities rendered/*</text>
  <text class="code"  x="844" y="183">portals containers economy players signs</text>
  <text class="code"  x="844" y="199">beds tombstones dropped alerts sectors</text>
  <text class="code"  x="844" y="215">structures metrics/summary world-summary</text>
  <text class="code"  x="844" y="231">forensics/{coin-caches,issuers,guild-gear}</text>
  <text class="code"  x="844" y="247">db/{zdo,containers,selection,spawn-histo}</text>
  <text class="code"  x="844" y="263">db/snapshots{,/ingest,/delta,/compare}</text>
  <text class="code"  x="844" y="279">prefabs/unresolved</text>

  <rect class="box" x="830" y="306" width="304" height="96"/>
  <text class="title" x="844" y="326">Ingest contract (Islet → Steward)</text>
  <text class="code"  x="844" y="345">POST db/snapshots/ingest</text>
  <text class="sub"   x="844" y="362">local file path, not a body upload (saves &gt; 1 GB)</text>
  <text class="label" x="844" y="380">receipt: snapshotId, fileHash, parsedZdos,</text>
  <text class="label" x="844" y="396">coverage%, delta{...}, dictionaryMismatch</text>

  <rect class="box" x="830" y="414" width="304" height="72"/>
  <text class="title" x="844" y="434">Archive — Parquet + zstd</text>
  <text class="code"  x="844" y="453">snapshot-&lt;id&gt;-&lt;source&gt;/{zdo,container_item,</text>
  <text class="code"  x="844" y="469">world_snapshot}.parquet</text>
  <text class="sub"   x="844" y="483">lossless, 10.5× smaller, queryable in place</text>

  <!-- flow arrows -->
  <path class="arrow" d="M366 300 L400 300"/>
  <path class="arrow" d="M780 300 L814 300"/>

  <!-- footer notes -->
  <rect class="box" x="30" y="524" width="1120" height="96"/>
  <text class="title" x="46" y="546">Two contracts that fail closed</text>
  <text class="label" x="46" y="568">Publish gate — refuses to publish unless the am4-sourced snapshot's recorded file_hash equals the SHA-256 of the world file AM4 will serve. Otherwise the</text>
  <text class="label" x="46" y="584">DuckDB view and the in-memory view would describe different saves. Also refuses on zero ZDO rows, or a snapshot with no prefab dictionary recorded.</text>
  <text class="label" x="46" y="606">Dictionary skew — every snapshot records the dictionary that named it; a cross-dictionary compare returns dictionaryMismatch and a warning banner rather than reporting renames as world change.</text>

  <text class="sub" x="30" y="654">Timing, measured on a 9.16M-ZDO save: fresh cache build ~47 s; ingest appended into an existing cache 12–13 min, because finish() has already created the indexes.</text>
  <text class="sub" x="30" y="674">Storage: ~1.2 GB live DuckDB per snapshot, 113.7 MB archived. Islet must treat ingest as a long-running job, not a request/response call.</text>
</svg>
