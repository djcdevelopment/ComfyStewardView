 /* Styling is lifted from the AM4 image gallery so the two read as one product.
    Layout, facet chips, pager and lightbox behave identically; only the meaning
    of a cell changes: a photograph of a structure, not a generated image. */
 :root{--bg:#0e141c;--panel:#1a2028;--line:#2f353e;--fg:#dde3ee;--mut:#d8c3ad;--accent:#ffc174;
        --flame:#f59e0b;--bronze:#d97707;--ember:rgba(245,158,11,.25);--line-warm:#534434;
        --font-display:'Bodoni Moda',Georgia,serif;
        --font-body:'Plus Jakarta Sans',system-ui,sans-serif;
        --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
 *{box-sizing:border-box}
 html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);-webkit-text-size-adjust:100%}
 a{color:inherit}
 header{position:sticky;top:0;z-index:20;background:rgba(14,20,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
 .topline{display:flex;align-items:center;gap:10px;padding:9px 12px}
 .topline b{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.02em;white-space:nowrap}
 .topline .sub{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
 .filt{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid rgba(217,119,6,.5);color:var(--fg);border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;padding:8px 13px;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
 .filt:hover{border-color:var(--bronze)}
 .filt .arr{transition:transform .2s;opacity:.65;font-weight:400}
 header.open #expbtn{background:var(--flame);border-color:var(--flame);color:#2a1700}
 header.open #expbtn .arr{transform:rotate(180deg)}
 .fbadge{display:none;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:4px;background:var(--accent);color:#2a1700;font-family:var(--font-mono);font-size:11px;font-weight:700;line-height:1}
 header.open .fbadge{background:#2a1700;color:var(--accent)}
 .panel{display:none;padding:4px 12px 12px;max-height:60vh;overflow:auto}
 header.open .panel{display:block}
 .facet{margin:10px 0 2px;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
 .checks{display:flex;flex-wrap:wrap;gap:6px}
 .ck{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid rgba(245,158,11,.25);border-radius:4px;padding:5px 11px;font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;cursor:pointer;user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
 .ck.on{background:rgba(245,158,11,.18);border-color:var(--flame);color:var(--accent);font-weight:600}
 .ck input{display:none}
 .ck .cnt{opacity:.55;font-variant-numeric:tabular-nums}
 .ck.on .cnt{opacity:.8}
 .panel .clr{margin-top:10px;background:none;border:1px solid var(--line);color:var(--mut);border-radius:4px;padding:6px 12px;font-size:12px;cursor:pointer}
 .sortrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
 main{padding:8px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
 .cell{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#000;cursor:pointer}
 .cell:hover{outline:1px solid var(--bronze);outline-offset:-1px}
 .cell img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
 .cell img.in{opacity:1}
 .cell .badge{position:absolute;left:5px;top:5px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:4px;color:#2a1700;z-index:2}
 .cell .tt{position:absolute;right:5px;top:5px;font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;background:rgba(0,0,0,.6);padding:1px 5px;border-radius:4px;color:var(--mut);z-index:2}
 .cell .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 7px 6px;font-size:11px;line-height:1.3;color:#fff;
   background:linear-gradient(transparent,rgba(0,0,0,.88));transform:translateY(100%);transition:transform .18s;pointer-events:none}
 .cell:hover .cap{transform:translateY(0)}
 .cell .star{position:absolute;right:5px;bottom:5px;z-index:4;font-size:19px;line-height:1;cursor:pointer;color:#fff;opacity:.8;text-shadow:0 1px 3px #000;display:none}
 .cell .star.on{color:#ffc32d;opacity:1}
 .cell .star i{font-style:normal;font-size:12px;margin-left:2px;vertical-align:2px}
 body.canstar .cell .star{display:block}
 .acts{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
 /* Three tiers, deliberately unalike: navigation, then things you can press,
    then things you can only read. The first cut styled a clickable vote chip and
    fourteen read-only facts identically, and nobody could tell which was which. */
 .act{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
      padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;
      display:inline-flex;align-items:center;gap:7px;line-height:1}
 .act:hover{background:#242a33;border-color:var(--accent)}
 .act.pri{border-color:var(--bronze);color:var(--accent)}
 .act.pri:hover{background:var(--accent);color:#2a1700}
 .ico{flex:0 0 auto}
 .act:hover{border-color:var(--accent)}
 .hint{font-size:12px;color:var(--mut);line-height:1.5}
 .empty{color:var(--mut);text-align:center;padding:50px 10px;font-size:14px}
 .psize{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;color:var(--mut)}
 .psize input{width:56px;background:#090f16;border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:6px 8px;font-family:var(--font-mono);font-size:13px;text-align:center}
 .psize input:focus{outline:none;border-color:var(--flame)}
 .pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 10px 6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;color:var(--mut)}
 .pager button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:7px 15px;font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;cursor:pointer}
 .pager button:disabled{opacity:.4;cursor:default}
 #lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.95);display:none;flex-direction:column}
 #lb.show{display:flex}
 #lb .x{position:absolute;top:env(safe-area-inset-top);right:0;padding:12px 18px;font-size:24px;color:#fff;cursor:pointer;z-index:3}
 #lb .stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
 #lb .stage img{max-width:100%;max-height:100%;object-fit:contain}
 #lb .info{background:var(--panel);border-top:1px solid rgba(217,119,6,.4);padding:12px 16px calc(14px + env(safe-area-inset-bottom));max-height:48vh;overflow:auto}
 #lb .navbar{margin:0 0 10px}
 #lb .navlabel{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:4px}
 #lb .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
 #lb .crumbs a,#lb .crumbs .here{display:inline-flex;align-items:center;gap:5px}
 #lb .crumbs a{color:var(--fg);cursor:pointer;border-bottom:1px solid var(--line)}
 #lb .crumbs a:hover{color:var(--accent);border-bottom-color:var(--accent)}
 #lb .crumbs .here{color:var(--accent);font-weight:600}
 #lb .crumbs .sep{opacity:.45}
 #lb .pr{line-height:1.4;color:#fff;margin-bottom:10px}
 #lb .pr b{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:.02em;display:block}
 #lb .pr i{font-style:normal;font-size:13px;color:var(--mut)}
 #lb .meta{display:flex;flex-wrap:wrap;gap:5px;font-size:11px;margin:2px 0 12px;color:var(--mut)}
 #lb .meta span{background:#161c24;padding:2px 7px;border-radius:4px;font-family:var(--font-mono);font-size:11px;letter-spacing:.04em}
 #lbstar.on{background:#ffc32d;border-color:#ffc32d;color:#2a1700}
 #lbstar.on:hover{background:#ffc32d;border-color:#fff}
 #lb .hintrow{font-size:12px;color:var(--mut);line-height:1.5;margin:-4px 0 10px}
 #lb .hintrow:empty{display:none}
 #lb .rtitle{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:4px 0 6px}
 #lb .rends{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
 #lb .rends::-webkit-scrollbar{display:none}
 #lb .rend{flex:0 0 auto;width:96px;cursor:pointer}
 #lb .rend .fr{aspect-ratio:1;border-radius:7px;overflow:hidden;background:#000;border:2px solid transparent}
 #lb .rend.cur .fr{border-color:var(--flame)}
 #lb .rend img{width:100%;height:100%;object-fit:cover}
 #lb .rend .lab{font-size:10px;margin-top:3px;text-align:center;color:var(--mut)}
 #lb .nav-a{position:absolute;top:42%;transform:translateY(-50%);font-size:34px;color:rgba(255,255,255,.65);padding:8px 14px;cursor:pointer;user-select:none;z-index:2}
 #lb .pv{left:0}#lb .nx{right:0}
 .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--flame);color:#2a1700;font-size:13px;font-weight:600;padding:8px 16px;border-radius:4px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
 .toast.show{opacity:1}
 /* The archive's front door. The viewer is copied verbatim into eight
    directories, so every href it carries has to be root-absolute. */
 .filt.home .emblem{flex:0 0 auto;opacity:.9}
 .filt.home:hover .emblem{opacity:1}
 @media (max-width:640px){.filt.home span{display:none}.filt.home{padding:8px 10px}}
</style>

<script>
// ---- state ----
let DB={images:[]}, MINE=new Set(), VOTES={};   // REQS/CLAIMS/USER/SIGNEDIN went with the signals API
let DEPTH={}, JUDGE={};               // instrument side-files; absent is fine
let sel={region:new Set(),kind:new Set(),environment:new Set(),structure:new Set(),perspective:new Set(),area:new Set()};
let showFog=false;                    // whiteout frames stay one click away, not gone
let sort='showcase', page=0, view=[], cur=-1;
let ERAS=null, pinned=null;   // the auto score is the most useful first impression
const byRun={};        // run id -> every frame of that capture run
const byCluster={};    // structure key -> every frame of that build
const byArea={};       // area key -> every frame in that 2 km neighbourhood

// Four names, hand-picked long before anyone dumped the list the game actually
// has -- comfy-camera-proof-envs.json is written at the top of every plan run
// now, so this map can be filled in from measurement rather than guessed at.
// Anything missing already falls back to grey at the call site.
const ENVCOLOR={Clear:'#7aa2ff',Misty:'#9ad5c8',Rain:'#8fb2d9',ThunderStorm:'#b79ae0'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// The structure chip. Valheim gives builds no names, so the builder derives one
// from the place's most distinctive trait ("major hub · 19,720") and a hand-written
// name in cluster-names.json overrides it. Rank and piece count alone identified a
// cluster but said nothing about what it was.
// A facet filters on a KEY and displays TEXT, and for structures the two must
// differ. Labels only became unique when name_structures.py disambiguated them;
// an unnamed cluster still falls back to a derived label like "build · 2,671",
// and two of those collide into one chip that filters both builds at once.
// Drawn, not typed. The first cut of the drill-in buttons used U+25A6 and
// U+1F5FA and both came out as tofu on Windows: the bytes were correct UTF-8 and
// the charset was declared, the glyphs just are not in the font stack. The
// Filters funnel in the header had already solved this with an inline path, so
// everything pictographic uses one now. Nothing above U+2606 survives in this
// file, which is the only version of "it renders everywhere" that holds up.
const ICON={
  grid:'M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z',
  pin:'M8 14.5S3 9.9 3 6.4a5 5 0 0 1 10 0c0 3.5-5 8.1-5 8.1z M8 7.9a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2z',
  home:'M2.5 7.2 8 2.5l5.5 4.7 M4 6.6v7h8v-7',
  camera:'M2 5h2.5l1-1.5h5L11.5 5H14v8H2z M8 11a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8z',
};
const svg=k=>`<svg class=ico width=14 height=14 viewBox="0 0 16 16" fill=none `+
  `stroke=currentColor stroke-width=1.5 stroke-linejoin=round><path d="${ICON[k]}"/></svg>`;

const structOf=r=>r.label||(r.cluster_rank!=null?`#${r.cluster_rank}`:'unmatched');
const structKey=r=>r.cluster_id!=null?'c'+r.cluster_id:'i'+r.id;
const areaKey=r=>r.area_id!=null?'a'+r.area_id:null;
// "near Pirate Hideout · 4,443" is the chip's text; a sentence wants the
// disambiguating piece count off the end.
const shortName=r=>(r.label||'this build').replace(/ · [\d,]+$/,'');
const areaPhrase=r=>(r.area_label||'in this area').replace(/ · [\d,]+$/,'');

// Valheim's time of day is a 0..1 fraction of the day, 0.5 being noon. Shown raw
// in a corner it reads as a score out of one, which is the opposite of what it
// means -- 0.90 is a useless midnight frame and 0.64 is the best light there is.
// So render it as a clock.
const clockOf=t=>{
  if(t==null) return '';
  const m=Math.round(t*24*60), h=Math.floor(m/60)%24;
  return `${String(h).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
};

async function boot(){
  try{ DB=await (await fetch('index.json',{cache:'no-store'})).json(); }
  catch(e){ $('main').innerHTML='<div class=empty>could not load index.json</div>'; return; }
  if(DB.world){ $('worldTitle').textContent=DB.world; document.title=`${DB.world} — what people built`; }

  for(const r of DB.images){
    (byRun[r.run]=byRun[r.run]||[]).push(r);
    (byCluster[structKey(r)]=byCluster[structKey(r)]||[]).push(r);
    const a=areaKey(r); if(a) (byArea[a]=byArea[a]||[]).push(r);
  }

  // Instrument side-files: depth/luma geometry and the judge's one-liners.
  // Metric-only, and optional — an old deploy without them still renders.
  // Each published era is a complete standalone copy of this page at its own
  // path, so nothing linked them and the archive was only reachable by typing
  // the URL. The publisher writes eras.json with absolute hrefs under the
  // route; absent, the chips simply do not appear.
  try{ ERAS=await (await fetch('eras.json',{cache:'no-store'})).json(); }catch(e){}
  try{ DEPTH=await (await fetch('depth.json',{cache:'no-store'})).json(); }catch(e){}
  try{ JUDGE=await (await fetch('judge.json',{cache:'no-store'})).json(); }catch(e){}

  // On this gallery the star IS the community vote — any logged-in user, not
  // the admin-only print-prep flag the image gallery uses. Guarded: if the bot
  // is down the gallery still renders, just without counts.
  await loadSignals();
  document.body.classList.add('canstar');

  applyHash();
  buildPanel(); render();
}

// #build=182 / #area=7 -- what makes a drill-in a link rather than a button.
// Reading it is one function so that arriving at the URL, editing the hash by
// hand, and pressing Back all land in the same state.
function applyHash(){
  sel.structure.clear(); sel.area.clear();
  const m=/^#(build|area)=(\w+)$/.exec(location.hash||'');
  if(!m){ sort='showcase'; return; }   // no hash is the front door
  const [,kind,id]=m;
  if(kind==='build'){ sel.structure.add('c'+id); sort='best'; }
  else { sel.area.add('a'+id); sort='showcase'; }
}
function routeFromHash(){
  applyHash(); page=0; closeLb(); buildPanel(); render();
}
addEventListener('popstate', routeFromHash);
addEventListener('hashchange', routeFromHash);

function facetValues(key){
  const f={};
  for(const r of DB.images){
    let v,t;
    if(key==='structure'){ v=structKey(r); t=structOf(r); }
    else if(key==='area'){ v=areaKey(r); t=r.area_label; }
    else { v=r[key]; t=v; }
    if(v==null||t==null) continue;
    (f[v]=f[v]||{n:0,t:t}).n++;
  }
  return Object.entries(f).sort((a,b)=>b[1].n-a[1].n);
}

function buildPanel(){
  const facets=[['region','Region'],['perspective','Perspective'],
                ['kind','Kind of place'],['environment','Weather'],
                ['area','Area'],['structure','Structure']];
  let h='';
  if(ERAS&&ERAS.eras&&ERAS.eras.length>1){
    h+=`<div class=facet>Era</div><div class=checks>`;
    for(const e of ERAS.eras){
      const on=e.slug===ERAS.current;
      h+=on ? `<label class="ck on" style="pointer-events:none">${e.label}</label>`
            : `<a class=ck href="${e.href}">${e.label}</a>`;
    }
    h+='</div>';
  }
  for(const [key,label] of facets){
    const vals=facetValues(key);
    if(vals.length<2&&!sel[key].size) continue;    // a one-value facet is not a filter
    // Only the 40 commonest values get a chip, and a drill-in can select a build
    // far outside that -- 478 has six frames against the top structure's dozens.
    // Without this the filter is on, invisible, and only "clear filters" escapes.
    const shown=vals.slice(0,40);
    for(const e of vals) if(sel[key].has(e[0])&&!shown.includes(e)) shown.push(e);
    h+=`<div class=facet>${label}</div><div class=checks>`;
    for(const [v,{n,t}] of shown){
      h+=`<label class=ck data-k="${esc(key)}" data-v="${esc(v)}"><input type=checkbox>${esc(t)} <span class=cnt>${n}</span></label>`;
    }
    h+='</div>';
  }
  // Whiteout fog frames are hidden, not deleted: the chip says how many and
  // one click brings them back. The detector is an instrument, not a verdict.
  const nfog=DB.images.reduce((a,r)=>a+(r.fog?1:0),0);
  if(nfog) h+=`<div class=facet>Hidden</div><div class=checks>`+
    `<label class="ck${showFog?' on':''}" id=fogchip>fog <span class=cnt>${nfog}</span></label></div>`;
  h+=`<div class=facet>Sort</div><div class="checks sortrow">`;
  for(const [k,l] of [['showcase','every build'],['best','auto scored'],['absolute','raw score'],['recent','newest'],['rank','by rank'],['pieces','biggest build'],['height','tallest'],['stars','starred first'],['light','by time of day']])
    h+=`<label class=ck data-sort="${k}"${sort===k?' style="pointer-events:none"':''}>${l}</label>`;
  h+=`</div><button class=clr id=clrbtn>clear filters</button>`;
  $('panel').innerHTML=h;

  $('panel').querySelectorAll('.ck[data-k]').forEach(el=>{
    const k=el.dataset.k,v=el.dataset.v;
    if(sel[k].has(v)) el.classList.add('on');
    el.onclick=e=>{ e.preventDefault(); sel[k].has(v)?sel[k].delete(v):sel[k].add(v);
      el.classList.toggle('on'); page=0; render(); };
  });
  $('panel').querySelectorAll('.ck[data-sort]').forEach(el=>{
    el.classList.toggle('on', el.dataset.sort===sort);
    el.onclick=()=>{ sort=el.dataset.sort; page=0; buildPanel(); render(); };
  });
  if($('fogchip')) $('fogchip').onclick=()=>{ showFog=!showFog; page=0; buildPanel(); render(); };
  // Clearing filters returns to the front door, not to a filterless list of all
  // 2,081 frames -- a drill-in switched the sort off showcase, and leaving it off
  // is how someone ends up back in the wall of variants they just escaped.
  $('clrbtn').onclick=()=>goHome(false);
}

// The aesthetic head scores a landscape above a room every time: measured over
// this gallery the eye-level frames median 0.45 below the drone ones on the
// same scale. Sorting the whole set on the raw number therefore buries every
// interior behind every exterior -- a fact about what the model likes to look
// at, not about the photographs. "auto scored" ranks each frame WITHIN its own
// perspective and sorts on that percentile, so the best room sits beside the
// best aerial. "raw score" keeps the unadjusted order for comparing across.
let PCT=null, PCTN=-1;
function pct(){
  if(PCTN===DB.images.length) return PCT;
  const groups={};
  for(const r of DB.images){
    if(r.aesthetic==null) continue;
    const k=r.perspective||'?';
    if(!groups[k]) groups[k]=[];
    groups[k].push(r.aesthetic);
  }
  for(const k in groups) groups[k].sort((a,b)=>a-b);
  PCT={};
  for(const r of DB.images){
    if(r.aesthetic==null){ PCT[r.id]=-1; continue; }
    const g=groups[r.perspective||'?'];
    let lo=0, hi=g.length;
    while(lo<hi){ const mid=(lo+hi)>>1; if(g[mid]<r.aesthetic) lo=mid+1; else hi=mid; }
    PCT[r.id]= g.length>1 ? lo/(g.length-1) : 1;
  }
  PCTN=DB.images.length;
  return PCT;
}

// One frame per build, best first. The gallery holds about eight photographs of
// every structure, so a score-ordered view of all of them puts six near-identical
// tiles in a row and arrowing through the lightbox reads as the same few popular
// builds over and over. That is the right answer to "which photographs are best"
// and the wrong one to "what did people build", which is what a visitor is asking.
//
// Runs AFTER filtering, never before: drilling into one build has to show all of
// that build's frames, and it does exactly because the collapse sees the filtered
// set. Best-of is by percentile within perspective for the same reason the sort
// is -- otherwise an interior-only build never wins its own slot.
function onedown(rows){
  const p=pct(), best=new Map();
  // `pinned` wins its build's slot outright. Scoping to an area keeps the
  // collapse on, and the photograph already open is usually NOT its build's best
  // frame -- without this it drops out of `view` and the drill-in closes the
  // viewer instead of re-scoping it.
  const rank=r=>[r.id===pinned?1:0, p[r.id]??-1, r.aesthetic??-1];
  const better=(a,b)=>{ const x=rank(a), y=rank(b);
    return x[0]!==y[0]?x[0]>y[0] : x[1]!==y[1]?x[1]>y[1] : x[2]>y[2]; };
  for(const r of rows){
    const k=structKey(r), cur=best.get(k);
    if(!cur||better(r,cur)) best.set(k,r);
  }
  return [...best.values()];
}

function filtered(){
  return DB.images.filter(r=>
    (showFog||!r.fog) &&
    (!sel.region.size||sel.region.has(r.region)) &&
    (!sel.perspective.size||sel.perspective.has(r.perspective)) &&
    (!sel.kind.size||sel.kind.has(r.kind)) &&
    (!sel.environment.size||sel.environment.has(r.environment)) &&
    (!sel.area.size||sel.area.has(areaKey(r))) &&
    (!sel.structure.size||sel.structure.has(structKey(r))));
}

function render(){
  view=filtered();
  if(sort==='showcase'){ const p=pct();
    view=onedown(view);
    view.sort((a,b)=>(p[b.id]??-1)-(p[a.id]??-1)||(b.aesthetic??-1)-(a.aesthetic??-1)); }
  else if(sort==='best'){ const p=pct();
    view.sort((a,b)=>(p[b.id]??-1)-(p[a.id]??-1)||(b.aesthetic??-1)-(a.aesthetic??-1)); }
  else if(sort==='absolute') view.sort((a,b)=>(b.aesthetic??-1)-(a.aesthetic??-1));
  else if(sort==='rank') view.sort((a,b)=>(a.cluster_rank||1e9)-(b.cluster_rank||1e9)||(a.variant||'').localeCompare(b.variant||''));
  else if(sort==='pieces') view.sort((a,b)=>(b.pieces||0)-(a.pieces||0));
  else if(sort==='height') view.sort((a,b)=>(b.height_m||0)-(a.height_m||0));
  else if(sort==='light') view.sort((a,b)=>(a.time_of_day||0)-(b.time_of_day||0));
  else if(sort==='stars') view.sort((a,b)=>(MINE.has(b.id)?1:0)-(MINE.has(a.id)?1:0)||(VOTES[b.id]||0)-(VOTES[a.id]||0)||b.ts-a.ts);
  else view.sort((a,b)=>b.ts-a.ts);

  const n=pageSize();
  const pages=Math.max(1,Math.ceil(view.length/n));
  page=Math.min(page,pages-1);
  const slice=view.slice(page*n,page*n+n);

  const active=Object.values(sel).reduce((a,s)=>a+s.size,0);
  $('fbadge').style.display=active?'inline-flex':'none';
  $('fbadge').textContent=active;
  $('sub').textContent = sort==='showcase'
    ? `${view.length} builds · ${DB.n.toLocaleString()} photographs`
    : `${view.length} of ${DB.n} photographs · ${DB.runs} setups`;

  $('main').innerHTML = slice.length
    ? `<div class=grid>${slice.map(cellHtml).join('')}</div>` +
      `<div class=pager><button id=pp ${page?'':'disabled'}>‹ prev</button>` +
      `<span>${page+1} / ${pages}</span>` +
      `<button id=pn ${page<pages-1?'':'disabled'}>next ›</button></div>`
    : '<div class=empty>nothing matches those filters</div>';

  $('main').querySelectorAll('.cell').forEach(el=>{
    const i=+el.dataset.i;
    el.onclick=ev=>{ if(ev.target.classList.contains('star')) return; openLb(page*n+i); };
    const st=el.querySelector('.star');
    if(st) st.onclick=ev=>{ ev.stopPropagation(); toggleStar(slice[i].id); };
    const img=el.querySelector('img');
    img.onload=()=>img.classList.add('in');
  });
  if($('pp')) $('pp').onclick=()=>{page--;render();window.scrollTo(0,0);};
  if($('pn')) $('pn').onclick=()=>{page++;render();window.scrollTo(0,0);};
}

function cellHtml(r,i){
  const col=ENVCOLOR[r.environment]||'#8a8a99';
  const cap = r.pieces
    ? `${r.pieces.toLocaleString()} pieces · ${Math.round(r.height_m)} m tall` +
      (r.builders>1?` · ${r.builders} builders`:'')
    : 'unmatched shot';
  return `<div class=cell data-i="${i}">
    <img loading=lazy src="thumb/${esc(r.id)}.webp" alt="">
    <span class=badge style="background:${col}">${esc(r.environment||'')}</span>
    <span class=tt title="${r.aesthetic!=null?'aesthetic score for this photograph':'structure ranking score'}">${r.aesthetic!=null?r.aesthetic.toFixed(2):(r.score!=null?r.score.toFixed(1):'')}</span>
    <span class="star${MINE.has(r.id)?' on':''}">${MINE.has(r.id)?'★':'☆'}${VOTES[r.id]?`<i>${VOTES[r.id]}</i>`:''}</span>
    <div class=cap>${esc(cap)}</div></div>`;
}

// ---- lightbox ----
function openLb(i){
  cur=i; const r=view[i]; if(!r) return;
  // 1600px render, falling back to the thumbnail only if it is missing. Opening a
  // picture and getting the same thumbnail back is the whole point of a lightbox
  // failing.
  $('lbimg').src='large/'+r.id+'.webp';
  $('lbimg').onerror=()=>{ $('lbimg').onerror=null; $('lbimg').src='thumb/'+r.id+'.webp'; };
  // The build has a name now; leading with it makes this read as a caption
  // rather than as a row of measurements.
  const facts=[];
  if(r.pieces) facts.push(`${r.pieces.toLocaleString()} pieces`);
  if(r.height_m) facts.push(`${Math.round(r.height_m)} m tall`);
  if(r.builders>1) facts.push(`${r.builders} builders`);
  $('lbtitle').innerHTML = r.pieces
    ? `<b>${esc(shortName(r))}</b><i>${esc(facts.join(' · '))}</i>`
    : '<b>unmatched shot</b>';
  const bits=[];
  if(r.cluster_rank) bits.push('rank #'+r.cluster_rank);
  if(r.region) bits.push(r.region);
  if(r.portals) bits.push(`${r.portals} portals`);
  if(r.beds) bits.push(`${r.beds} beds`);
  if(r.signs) bits.push(`${r.signs} signs`);
  if(r.builders) bits.push(`${r.builders} builders`);
  if(r.environment) bits.push(r.environment);
  if(r.aesthetic!=null) bits.push('aesthetic '+r.aesthetic.toFixed(2));
  if(r.score!=null) bits.push('structure score '+r.score.toFixed(2));
  if(r.time_of_day!=null) bits.push(clockOf(r.time_of_day)+' in-game');
  if(r.shot_distance_m!=null) bits.push(`shot from ${Math.round(r.shot_distance_m)} m`);
  if(r.perspective) bits.push(r.perspective);
  if(r.fog) bits.push('flagged: fog whiteout');
  // Instruments, when this frame has been measured. Depth is geometry (does
  // the frame have layers), the judge is a rubric read of the picture.
  const d=DEPTH[r.id];
  if(d&&d.depth_score!=null) bits.push(`depth ${d.depth_score.toFixed(2)} · block ${d.center_block.toFixed(2)} · far ${d.far_mass.toFixed(2)}`);
  if(d&&d.luma_mean!=null) bits.push(`luma ${Math.round(d.luma_mean)} ± ${Math.round(d.luma_spread)}`);
  const j=JUDGE[r.id];
  if(j&&j.score!=null) bits.push(`judge ${j.score} — ${j.reason||''}`);
  const nv=VOTES[r.id]||0;
  $('lbmeta').innerHTML=bits.map(b=>`<span>${esc(b)}</span>`).join('');

  // Where am I, and how do I get out. The row doubles as the navigation: whichever
  // segment matches the active filter is inert and accented, the others are the
  // moves available from here. Home closes the viewer, because "back to the
  // scrolling I came from" is the thing that was missing.
  const seen=x=>showFog||!x.fog;
  const nAll=new Set(DB.images.filter(seen).map(structKey)).size;
  const scope=sel.structure.size?'build':sel.area.size?'area':'all';
  const nHere=(byCluster[structKey(r)]||[]).filter(seen).length;
  const nArea=r.area_id!=null
    ? new Set((byArea['a'+r.area_id]||[]).filter(seen).map(structKey)).size : 0;
  const crumb=(here,id,html)=>here?`<span class=here>${html}</span>`:`<a id=${id}>${html}</a>`;
  let cb=crumb(scope==='all','cbhome',`${svg('home')} All ${nAll} builds`);
  if(r.area_id!=null&&nArea>1)
    cb+=`<span class=sep>›</span>`+
        crumb(scope==='area','cbarea',`${esc(areaPhrase(r))} · ${nArea} builds`);
  cb+=`<span class=sep>›</span>`+
      crumb(scope==='build','cbbuild',`${esc(shortName(r))} · ${nHere} shot${nHere===1?'':'s'}`);
  $('lbcrumbs').innerHTML=cb;
  if($('cbhome')) $('cbhome').onclick=()=>goHome(true);
  if($('cbarea')) $('cbarea').onclick=()=>drillTo('area','a'+r.area_id,r.id);
  if($('cbbuild')) $('cbbuild').onclick=()=>drillTo('structure',structKey(r),r.id);

  // Drill-ins: the showcase deliberately hides this build's other frames and the
  // rest of its neighbourhood, so the way back in has to live here, on the photo
  // the visitor is already looking at.
  // Counts are what the drill-in will actually show, not what exists: promising
  // six shots and landing on five is a small lie the fog filter tells for you.
  // A button for the scope you are already in is noise, so it is dropped.
  // Everything pressable, in one row, in one place. Voting used to sit as the
  // fifteenth chip in a line of fourteen read-only facts styled exactly like it,
  // and the two drill-ins lived in a separate row below -- three groups of
  // controls scattered through a wall of text.
  const voted=MINE.has(r.id);
  let acts=`<button class="act${voted?' on':''}" id=lbstar>${voted?'★':'☆'} `+
           `${voted?'voted':'vote'}${nv?` · ${nv}`:''}</button>`;
  if(nHere>1&&scope!=='build')
    acts+=`<button class="act pri" id=actall>${svg('grid')} all ${nHere} shots of this build</button>`;
  if(nArea>1&&scope!=='area')
    acts+=`<button class="act pri" id=actarea>${svg('pin')} ${nArea-1} more ${esc(areaPhrase(r))}</button>`;
  $('lbactions').innerHTML=acts;
  // Claiming lives on the builders page, not here. This surface carried its own
  // claim/request buttons against /api/valheim/*, served by the Discord bot on AM4
  // (~/am4bot/bot.py:1440). That API stopped on 2026-06-25 and the page later moved to
  // FX99, which has no /api route -- so the sign-in gate could never succeed and the
  // buttons never rendered. One claim surface is better than two, so they are gone.
  $('lbhint').innerHTML = r.cluster_id!=null
    ? `<a href="/valheim/creators/">claim this build or ask for more shots on the builders page</a>`
    : '';
  $('lbstar').onclick=()=>toggleStar(r.id,true);
  if($('actall')) $('actall').onclick=()=>drillTo('structure', structKey(r), r.id);
  if($('actarea')) $('actarea').onclick=()=>drillTo('area', 'a'+r.area_id, r.id);

  // Siblings of this BUILD. This used to key on run, which was right when a run
  // meant 23 light variants of one viewpoint and is wrong now that a run means
  // 240 frames across 40 structures -- it was listing hundreds of unrelated
  // thumbnails. Label by variant, since a build's frames differ by angle and
  // vantage rather than by time.
  // The strip follows the scope. Standing in an area it lists the NEIGHBOURS,
  // one frame each, which is what makes the area button visibly do something --
  // otherwise the click changed only the URL. Fog whiteouts stay out either way:
  // a thumbnail that cannot be opened is a dead end.
  const inArea = scope==='area' && r.area_id!=null;
  const sibs = inArea
    ? onedown((byArea['a'+r.area_id]||[]).filter(seen))
        .sort((a,b)=>(a.id===r.id?-1:b.id===r.id?1:0)||
                     (b.aesthetic??-1)-(a.aesthetic??-1))
    : (byCluster[structKey(r)]||[r]).filter(x=>seen(x)||x.id===r.id);
  $('lbrtitle').textContent = inArea
    ? `${sibs.length} builds ${areaPhrase(r)}`
    : 'every shot of this build';
  $('lbrends').innerHTML=sibs.map(s=>`<div class="rend${s.id===r.id?' cur':''}" data-id="${esc(s.id)}">
     <div class=fr><img loading=lazy src="thumb/${esc(s.id)}.webp" alt=""></div>
     <div class=lab>${esc(inArea?shortName(s):((s.variant||'').replace(/^[a-d]_/,'')||clockOf(s.time_of_day)))}</div></div>`).join('');
  $('lbrends').querySelectorAll('.rend').forEach(el=>{
    // In the showcase only one frame per build is in `view`, so a sibling
    // thumbnail usually is not. Drill in first, then land on it.
    el.onclick=()=>{
      const j=view.findIndex(v=>v.id===el.dataset.id);
      if(j>=0) return openLb(j);
      drillTo('structure', structKey(r), el.dataset.id);
    };
  });
  $('lb').classList.add('show');
}
// Apply a filter from inside the lightbox and stay on the same photograph.
// Two things are easy to get wrong here: `view` is rebuilt, so `cur` has to be
// re-found by id rather than reused; and the sort has to come off showcase,
// which would otherwise collapse the drilled-in set straight back to the one
// frame already on screen.
function drillTo(key, value, keepId){
  // Both scope filters clear first: standing in a build and clicking through to
  // its area must widen to the area, not intersect the two into the one build.
  pinned=keepId||null;
  sel.structure.clear(); sel.area.clear();
  sel[key].add(value);
  // An area is a set of buildings and a building is a set of photographs, so
  // scoping to an area keeps the one-per-build collapse and arrow-right walks
  // the neighbours. Dropping into 87 frames -- eight of each of twelve builds --
  // would be the repetition problem again, one level up.
  sort = key==='area' ? 'showcase' : 'best';
  page=0; buildPanel(); render();
  const j=view.findIndex(v=>v.id===keepId);
  if(j>=0){ page=Math.floor(j/pageSize()); render(); openLb(j); } else closeLb();
  const cid=value.replace(/^[ca]/,'');
  // pushState, not replaceState: Back is how a visitor expects to get out of a
  // build and return to the showcase they were browsing.
  try{ history.pushState(null,'',key==='structure'?`#build=${cid}`:`#area=${cid}`); }catch(e){}
}
function pageSize(){ return Math.max(1,parseInt($('psize').value)||100); }
// Clearing filters returns to the front door, not to a filterless list of all
// 2,081 frames -- a drill-in switched the sort off showcase, and leaving it off
// is how someone ends up back in the wall of variants they just escaped.
function goHome(close){
  for(const k in sel) sel[k].clear();
  sort='showcase'; page=0; pinned=null;
  try{ history.pushState(null,'',location.pathname+location.search); }catch(e){}
  buildPanel(); render();
  if(close) closeLb();
}
function closeLb(){ $('lb').classList.remove('show'); }
function step(d){ const j=cur+d; if(j>=0&&j<view.length) openLb(j); }

// Signed-out visitors all arrive as "anon", and the server's one-vote-per-user
// index would make them collide — first vote wins, everyone else silently
// ignored. So each browser keeps its own random id. Not a security boundary:
// clearing storage gets you another vote. It only separates honest visitors.
const VOTER=(()=>{
  try{
    let v=localStorage.getItem('valheim_voter');
    if(!v){ v=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2))
              .replace(/-/g,'').slice(0,32);
            localStorage.setItem('valheim_voter',v); }
    return v;
  }catch(e){ return ''; }   // private mode: vote still counts, just not remembered
})();

// Stars are kept in this browser. They used to come from /api/valheim/signals, served
// by the Discord bot on AM4 (~/am4bot/bot.py) -- that API stopped on 2026-06-25 and the
// page then moved to FX99, which has never had an /api route. So every load called a
// 404 and every star rolled itself back with an error. Local is honest and works.
const STAR_KEY='valheim_stars';
async function loadSignals(){
  try{ MINE=new Set(JSON.parse(localStorage.getItem(STAR_KEY)||'[]')); }
  catch(e){ MINE=new Set(); }   // private mode: stars work, just are not remembered
}
function saveStars(){
  try{ localStorage.setItem(STAR_KEY,JSON.stringify([...MINE])); }catch(e){}
}

function toggleStar(id,fromLb){
  const on=!MINE.has(id);
  on?MINE.add(id):MINE.delete(id);
  VOTES[id]=Math.max(0,(VOTES[id]||0)+(on?1:-1));
  saveStars();
  render(); if(fromLb) openLb(cur);
}

let tt;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }

$('expbtn').onclick=()=>$('hdr').classList.toggle('open');
$('psize').oninput=()=>{page=0;render();};
document.addEventListener('keydown',e=>{
  if(!$('lb').classList.contains('show')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowLeft') step(-1);
  if(e.key==='ArrowRight') step(1);
});
boot();
</script>
</body>
</html>
