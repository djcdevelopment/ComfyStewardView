<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Valheim Chronicles</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{meta_description}}">
<meta name="theme-color" content="#0e141c">
<link rel="icon" href="{{icon_href}}" type="image/svg+xml">
<link rel="stylesheet" href="{{css_href}}">
</head>
<body>
{{header}}
<main id="main" class="front">
  <section class="door">
    <h1>{{h1}}</h1>
    <form class="finder" action="/valheim/creators/" method="get" role="search">
      <label class="eyebrow" for="q">{{search_label}}</label>
      <div class="finder-row">
        <input id="q" name="q" type="search" maxlength="80" placeholder="{{search_placeholder}}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-haspopup="listbox" aria-controls="suggestions">
        <ul id="suggestions" role="listbox" aria-label="Matching builders" hidden data-loading="{{loading}}" data-failed="{{load_failed}}" data-empty="{{no_match}}"></ul>
      </div>
      <p id="finder-status" class="finder-status" role="status" aria-live="polite"></p>
      <p class="finder-foot"><span class="hint">{{search_hint}}</span><a class="quiet" href="/chronicles/guide/#claims">{{claim_hint}}</a></p>
    </form>
    <p class="cta-row"><a class="button forged wide" href="/valheim/">{{cta}}</a></p>
  </section>
  <script type="application/json" id="portrait-manifest">{{portraits_json}}</script>
</main>
{{footer}}
<script src="{{portraits_js_href}}" defer></script>
<script src="{{js_href}}" defer></script>
</body>
</html>
