# AM4 deployment: loopback-only publish, fronted by tailscale funnel at
# /steward. The world snapshot is a static frozen copy under ~/steward/world
# (never the live worlds_local dir). See tools/Deploy-Steward.ps1.
name: steward

services:
  steward:
    build: .
    image: comfy-steward-view:latest
    container_name: comfy-steward-view
    ports:
      - "127.0.0.1:7080:8003"
    volumes:
      - /home/derek/steward/world:/world:ro
      - steward-data:/data
    environment:
      # The data publisher writes STEWARD_WORLD_FILE to the deployment .env when a
      # completed-era release becomes the active public world.  The default keeps
      # an existing deployment bootable before the first explicit activation.
      WORLD_FILE: "${STEWARD_WORLD_FILE:-/world/ComfyEra16.db}"
      JAVA_OPTS: "-Xmx6g -Djava.awt.headless=true"
      # Publish owns this instance's history; API ingest would be clobbered by the next publish.
      STEWARD_DISABLE_INGEST: "1"
      # Full commit that built the running jar. Anchor exports fail closed without it.
      STEWARD_SOURCE_REVISION: "${STEWARD_SOURCE_REVISION:-}"
      # Required for the only public write endpoint; never embedded in the page or image.
      STEWARD_QUEST_IMPORT_TOKEN: "${STEWARD_QUEST_IMPORT_TOKEN:-}"
    mem_limit: 8g
    restart: unless-stopped

volumes:
  steward-data:
